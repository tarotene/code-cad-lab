name: CI

# 全部品を実行して、検査が通り 3MF/STEP が書き出せることを確かめる。
# `CI passed` は quality ruleset が必須にする集約 job(個々の job 名を ruleset に
# 焼き込まず、job を足しても ruleset を書き換えなくて済むようにする)。
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Sync (lockfile must be up to date)
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest -q

      - name: Check every part
        run: uv run lab check --all

      - name: Export every part
        run: uv run lab export --all

  docs:
    name: API docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: tarotene/dotfiles/.github/actions/docs-python@main
        with:
          # requires-python が >=3.13,<3.14 なので、既定の '3.x'(最新)では
          # `pip install -e .` が落ちる。
          python-version: '3.13'
          upload: 'false'

  ci-passed:
    name: CI passed
    if: always()
    needs: [check, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any needed job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
