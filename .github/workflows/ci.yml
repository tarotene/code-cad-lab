name: CI

# 全部品を実行して、検査が通り 3MF/STEP が書き出せることを確かめる。
# `CI passed` は quality ruleset が必須にする集約 job(個々の job 名を ruleset に
# 焼き込まず、job を足しても ruleset を書き換えなくて済むようにする)。
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Sync (lockfile must be up to date)
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest -q

      - name: Check every part
        run: uv run lab check --all

      - name: Export every part
        run: uv run lab export --all

  ci-passed:
    name: CI passed
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any needed job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
