[project]
name = "code-cad-lab"
version = "0.1.0"
description = "コードで部品を設計して FDM 3D プリンタで刷る PoC の作業場(build123d)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    # 0.x はマイナー版ごとに破壊的変更が入るので、完全一致で pin する(ADR-0001)。
    "build123d==0.13.0",
]

[project.optional-dependencies]
# lab show / watch / viewer だけが使う。検査と書き出しには要らないので、別のリポジトリから
# 使うときは `code-cad-lab[viewer]` と書いたときだけ入る(docs/consuming.md)。
viewer = [
    "ocp_viewer",
    "watchfiles",
]

[project.scripts]
lab = "lab.cli:main"

[dependency-groups]
dev = [
    "code-cad-lab[viewer]",
    "pytest>=9.1.1",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lab"

[tool.ruff]
line-length = 100
src = ["src", "parts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
